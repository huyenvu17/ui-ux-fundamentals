<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thiết kế UI/UX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260908-v47">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-app-bar">
        <button class="preview-trigger" id="menuToggle" type="button" aria-label="Mở mục lục slide" aria-expanded="false">
          <span class="material-symbols-rounded" aria-hidden="true">dashboard</span>
          <span>Mục lục</span>
        </button>
        <div class="brand" role="button" tabindex="0" title="Về trang đầu">
          <span class="brand-mark material-symbols-rounded" aria-hidden="true">auto_awesome_mosaic</span>
          <div>
            <p class="brand-kicker">7 phần</p>
            <h1>Thiết kế UI/UX</h1>
          </div>
        </div>
        <div class="top-actions" aria-label="Điều hướng slide">
          <button class="icon-button" id="prevSlide" type="button" aria-label="Slide trước">
            <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
          </button>
          <button class="icon-button" id="nextSlide" type="button" aria-label="Slide sau">
            <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
          </button>
        </div>
      </header>

      <aside class="session-menu" id="sessionMenu" aria-label="Mục lục slide" aria-hidden="true">
        <div class="preview-panel-head">
          <div>
            <p>Mục lục</p>
            <h2>Chọn phần hoặc slide</h2>
          </div>
          <button class="icon-button" id="closePreview" type="button" aria-label="Đóng mục lục">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </div>
        <nav id="sessionList" class="session-list" aria-label="Các phần"></nav>
      </aside>
      <div class="preview-scrim" id="previewScrim" hidden></div>

      <main class="deck-area">
        <div class="progress-track" aria-hidden="true">
          <span id="progressBar"></span>
        </div>
        <section id="slideRoot" class="slide" aria-live="polite"></section>
        <footer class="slide-footer">
          <span id="sessionIndicator"></span>
          <span id="slideIndicator"></span>
        </footer>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Điều hướng slide (điện thoại)">
      <button class="mobile-nav-button" id="mobilePrev" type="button" aria-label="Slide trước">
        <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
      </button>
      <span class="mobile-nav-indicator" id="mobileIndicator"></span>
      <button class="mobile-nav-button" id="mobileNext" type="button" aria-label="Slide sau">
        <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
      </button>
    </nav>
    <script type="module" src="src/app.js?v=20260908-v47"></script>
  </body>
</html>
